name: EAS Android Build (APK & AAB Bundle)
on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build APK and AAB for ContractDecoder Pro
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: 🛡️ Install EAS CLI
        run: npm install -g eas-cli

      - name: 🔑 Authenticate Expo credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas login --with-token-raw "$EXPO_TOKEN"

      - name: 📦 Install Application Dependencies
        run: npm ci

      - name: 🚀 Compile Production App Bundle (.aab file)
        run: eas build --platform android --profile production --non-interactive --no-wait

      - name: 📱 Compile Preview Android Package (.apk file)
        run: eas build --platform android --profile preview --non-interactive --no-wait
