name: Build APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build APK?'
        required: false
        type: boolean
        default: true
      build_aab:
        description: 'Build AAB?'
        required: false
        type: boolean
        default: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.build_apk == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Setup EAS CLI
        run: npm install -g eas-cli
      
      - name: Build APK
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          eas build --platform android --profile preview --wait
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: '**/*.apk'
          retention-days: 30

  build-aab:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.build_aab == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Setup EAS CLI
        run: npm install -g eas-cli
      
      - name: Build AAB
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          eas build --platform android --profile production --wait
      
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: '**/*.aab'
          retention-days: 30

  summary:
    runs-on: ubuntu-latest
    needs: [build-apk, build-aab]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "✅ Build Complete!"
          echo ""
          echo "📦 Artifacts:"
          echo "  - APK: android-apk"
          echo "  - AAB: android-aab"
          echo ""
          echo "🎯 Next Steps:"
          echo "  1. Download artifacts from Actions"
          echo "  2. APK: Test on device"
          echo "  3. AAB: Upload to Play Store"
